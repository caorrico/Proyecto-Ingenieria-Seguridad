services:
  database:
    image: postgres:17-alpine
    container_name: firma_digital_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firma_digital}
      POSTGRES_USER: ${POSTGRES_USER:-firma_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firma_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-firma_user} -d ${POSTGRES_DB:-firma_digital}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - security_lab

  backend:
    build:
      context: ./backend
    container_name: firma_digital_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-firma_user}:${POSTGRES_PASSWORD:-firma_password}@database:5432/${POSTGRES_DB:-firma_digital}
      SECRET_KEY: ${SECRET_KEY:-development-only-change-before-production}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5242880}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - security_lab

  frontend:
    build:
      context: ./frontend
    container_name: firma_digital_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - security_lab

volumes:
  postgres_data:

networks:
  security_lab:
    driver: bridge
